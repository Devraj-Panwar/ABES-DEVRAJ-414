<!DOCTYPE html>
<html>

<head>
    <title>Student Entry Form</title>
    <link rel="stylesheet" href="01.css">
</head>

<body>

    <form>

        <fieldset>

            <legend>
                <h2>Student Entry Form</h2>
            </legend>

            <table>

                <tr>
                    <td>Student ID</td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    <td>Student Name</td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    <td>Father's Name</td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    <td>Mother's Name</td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    <td>Date of Birth</td>
                    <td><input type="date"></td>
                </tr>

                <tr>
                    <td>Gender</td>
                    <td>
                        <input type="radio" name="gender"> Male
                        <input type="radio" name="gender"> Female
                        <input type="radio" name="gender"> Other
                    </td>
                </tr>

                <tr>
                    <td>Mobile No.</td>
                    <td><input type="tel"></td>
                </tr>

                <tr>
                    <td>Email ID</td>
                    <td><input type="email"></td>
                </tr>

                <tr>
                    <td>Password</td>
                    <td><input type="password"></td>
                </tr>

                <tr>
                    <td>Address</td>
                    <td><textarea rows="4"></textarea></td>
                </tr>

                <tr>
                    <td>Department</td>
                    <td>
                        <select>
                            <option>CSE</option>
                            <option>ECE</option>
                            <option>ME</option>
                            <option>EE</option>
                            <option>CE</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>Course</td>
                    <td>
                        <select>
                            <option>B.Tech</option>
                            <option>M.Tech</option>
                            <option>BCA</option>
                            <option>MCA</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>Semester</td>
                    <td>
                        <select>
                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                            <option>4</option>
                            <option>5</option>
                            <option>6</option>
                            <option>7</option>
                            <option>8</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>Upload Photo</td>
                    <td><input type="file"></td>
                </tr>

                <tr>
                    <td colspan="2" align="center">
                        <input type="submit" value="Submit">
                        <input type="reset" value="Reset">
                    </td>
                </tr>

            </table>

        </fieldset>

    </form>

</body>

</html>
