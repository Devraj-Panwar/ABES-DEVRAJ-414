<!DOCTYPE html>
<html>
<head>
  <title>Flipkart - Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    <h1>Flipkart</h1>
    <div class="search-bar">
      <input type="text" placeholder="Search for products, brands and more">
      <button>Search</button>
    </div>
    <div class="nav-links">
      <a href="#">Login</a>
      <a href="#">Cart</a>
      <a href="#">More</a>
    </div>
  </div>

  <div class="categories">
    <a href="#">Electronics</a>
    <a href="#">Fashion</a>
    <a href="#">Home</a>
    <a href="#">Appliances</a>
    <a href="#">Beauty</a>
    <a href="#">Sports</a>
  </div>

  <div class="products">
    <div class="product">
      <img src="https://via.placeholder.com/200x150" alt="Product 1">
      <h3>Smartphone</h3>
      <p>₹14,999</p>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/200x150" alt="Product 2">
      <h3>Laptop</h3>
      <p>₹49,999</p>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/200x150" alt="Product 3">
      <h3>Headphones</h3>
      <p>₹1,499</p>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/200x150" alt="Product 4">
      <h3>Washing Machine</h3>
      <p>₹15,999</p>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/200x150" alt="Product 5">
      <h3>Camera</h3>
      <p>₹24,999</p>
    </div>
  </div>

  <div class="footer">
    <p> Flipkart Clone | Made by Devraj</p>
  </div>
</body>
</html>
